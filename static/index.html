<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Admin - Dadores Móveis e Eletros</title>
    <link rel="stylesheet" href="/static/css/estilo.css">
</head>
<body>

    <header>
        <div class="logo-container" style="display: flex; align-items: center; gap: 15px;">
            <img src="/static/img/logo-dm.jpg" alt="Logo DM" style="height: 60px; border-radius: 5px;">
            <div class="logo-texto">
                <span style="display: block; font-weight: bold; color: var(--primary); font-size: 1.2rem;">PAINEL ADMINISTRATIVO</span>
            </div>
        </div>
        <nav>
            <a href="/static/loja.html" class="link-nav">Ver Loja</a>
        </nav>
    </header>

    <div class="container-admin">
        <div class="card-form">
            <h2 id="tituloForm">Cadastrar Novo Produto</h2>
            <hr>
            <form id="meuForm">
                <div class="campo">
                    <label>Nome do Produto</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Sofá Retrátil 3 Lugares" required>
                </div>

                <div class="campo">
                    <label>Descrição</label>
                    <textarea id="descricao" name="descricao" placeholder="Detalhes do móvel..."></textarea>
                </div>

                <div class="linha-dupla">
                    <div class="campo">
                        <label>Preço (R$)</label>
                        <input type="number" id="preco" name="preco" step="0.01" required>
                    </div>
                    <div class="campo">
                        <label>Estoque</label>
                        <input type="number" id="quantidade_estoque" name="quantidade_estoque" required>
                    </div>
                </div>

                <div class="campo">
                    <label>Categoria</label>
                    <select id="categoria" name="categoria">
                        <option value="Sala">Sala</option>
                        <option value="Cozinha">Cozinha</option>
                        <option value="Quarto">Quarto</option>
                        <option value="Eletros">Eletros</option>
                    </select>
                </div>

                <div id="containerImagem" class="campo">
                    <label>Imagem do Produto</label>
                    <input type="file" id="imagem" name="imagem" accept="image/*">
                    <p id="avisoEdicao" style="display:none; font-size: 0.8rem; color: #666;">Deixe em branco para manter a imagem atual.</p>
                </div>
                <div class="campo" style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
                     <input type="checkbox" id="destaque" name="destaque" style="width: auto;">
                    <label for="destaque" style="margin-bottom: 0;">Exibir este produto nos Destaques da Loja</label>
                </div>

                <button type="submit" id="btnAcao" class="btn-acao">Enviar para Loja</button>
                <button type="button" id="btnCancelar" onclick="limparFormulario()" style="display:none; background:#999; margin-top:10px;" class="btn-acao">Cancelar Edição</button>
            </form>
        </div>
    </div>

    <div class="card-form" style="max-width: 900px; margin: 30px auto;">
        <h2>Produtos em Linha</h2>
        <hr>
        <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="text-align: left; border-bottom: 2px solid var(--primary);">
                        <th style="padding: 10px;">Foto</th>
                        <th style="padding: 10px;">Nome</th>
                        <th style="padding: 10px;">Preço</th>
                        <th style="padding: 10px;">Ações</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela"></tbody>
            </table>
        </div>
    </div>

    <script>
        let idEdicao = null;
        let listaProdutos = [];

        // Carregar lista ao abrir
        async function atualizarListaGestao() {
            const res = await fetch('/api/produtos/');
            listaProdutos = await res.json();
            const corpo = document.getElementById('corpoTabela');
            
            corpo.innerHTML = listaProdutos.map(p => `
                <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 10px;">
                        <img src="${p.imagem_url}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;">
                    </td>
                    <td style="padding: 10px; font-weight: 600;">${p.nome}</td>
                    <td style="padding: 10px;">R$ ${p.preco.toLocaleString('pt-BR')}</td>
                    <td style="padding: 10px;">
                        <button onclick="prepararEdicao(${p.id})" style="background: #f39c12; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Editar</button>
                        <button onclick="excluirProduto(${p.id})" style="background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Excluir</button>
                    </td>
                </tr>
            `).join('');
        }

        // Preparar Edição
        function prepararEdicao(id) {
            const p = listaProdutos.find(item => item.id === id);
            if (p) {
                idEdicao = p.id;
                document.getElementById('nome').value = p.nome;
                document.getElementById('preco').value = p.preco;
                document.getElementById('categoria').value = p.categoria;
                document.getElementById('descricao').value = p.descricao;
                document.getElementById('quantidade_estoque').value = p.quantidade_estoque || 0;
                
                document.getElementById('tituloForm').innerText = "Editando Produto";
                document.getElementById('btnAcao').innerText = "Salvar Alterações";
                document.getElementById('btnCancelar').style.display = "block";
                document.getElementById('avisoEdicao').style.display = "block";
                document.getElementById('imagem').required = false;
                document.getElementById('destaque').checked = p.destaque;

                window.scrollTo(0, 0);
            }
        }

        // Enviar Form (Cadastrar ou Editar)
        document.getElementById('meuForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            let url = '/api/produtos';
            let metodo = 'POST';

            if (idEdicao) {
                url = `/api/produtos/${idEdicao}`;
                metodo = 'PUT';
            }

            const res = await fetch(url, { method: metodo, body: formData });
            
            if(res.ok) {
                alert(idEdicao ? 'Produto atualizado!' : 'Produto cadastrado!');
                limparFormulario();
                atualizarListaGestao();
            } else {
                alert('Erro na operação. Verifique o console.');
            }
        };

        async function excluirProduto(id) {
            if (confirm("Deseja remover este móvel?")) {
                const res = await fetch(`/api/produtos/${id}`, { method: 'DELETE' });
                if (res.ok) { atualizarListaGestao(); }
            }
        }

        function limparFormulario() {
            idEdicao = null;
            document.getElementById('meuForm').reset();
            document.getElementById('tituloForm').innerText = "Cadastrar Novo Produto";
            document.getElementById('btnAcao').innerText = "Enviar para Loja";
            document.getElementById('btnCancelar').style.display = "none";
            document.getElementById('avisoEdicao').style.display = "none";
            document.getElementById('imagem').required = true;
        }

        atualizarListaGestao();
    </script>
</body>
</html>
